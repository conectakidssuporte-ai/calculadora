<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Calculadora com histórico, uso pelo teclado e tema claro e escuro.">
  <meta name="theme-color" content="#F3F5F8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111418" media="(prefers-color-scheme: dark)">
  <title>Calculadora</title>
  <link rel="icon" href="icone.svg" type="image/svg+xml">
  <script>
    // aplica o tema antes de desenhar, para não piscar
    try {
      var t = localStorage.getItem('calculadora.tema');
      if (t === 'claro' || t === 'escuro') document.documentElement.dataset.tema = t;
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="src/estilo.css">
  <script type="module" src="src/tela.js"></script>
</head>
<body>
  <main class="app">
    <section class="calculadora" aria-label="Calculadora">
      <header class="topo">
        <h1>Calculadora</h1>
        <div class="acoes-topo">
          <button type="button" class="botao-icone" id="abrir-historico" aria-controls="historico" aria-expanded="false" title="Histórico (H)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v4h4"/><path d="M12 7v5l3 2"/></svg>
            <span class="visualmente-oculto">Histórico</span>
          </button>
          <button type="button" class="botao-icone" id="trocar-tema" title="Trocar tema">
            <svg class="icone-lua" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
            <svg class="icone-sol" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <span class="visualmente-oculto">Trocar entre tema claro e escuro</span>
          </button>
        </div>
      </header>

      <div class="visor">
        <div class="expressao" id="expressao" aria-hidden="true"></div>
        <output class="valor" id="valor" aria-live="polite" aria-atomic="true">0</output>
        <button type="button" class="copiar" id="copiar" title="Copiar resultado (Ctrl+C)">Copiar</button>
      </div>

      <div class="teclado" role="group" aria-label="Teclas">
        <button type="button" class="tecla funcao" data-tecla="C" aria-label="Limpar tudo">C</button>
        <button type="button" class="tecla funcao" data-tecla="⌫" aria-label="Apagar último dígito">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 5H9l-6 7 6 7h12z"/><path d="M12 9l6 6M18 9l-6 6"/></svg>
        </button>
        <button type="button" class="tecla funcao" data-tecla="%" aria-label="Porcentagem">%</button>
        <button type="button" class="tecla operador" data-tecla="/" aria-label="Dividir">÷</button>

        <button type="button" class="tecla" data-tecla="7">7</button>
        <button type="button" class="tecla" data-tecla="8">8</button>
        <button type="button" class="tecla" data-tecla="9">9</button>
        <button type="button" class="tecla operador" data-tecla="*" aria-label="Multiplicar">×</button>

        <button type="button" class="tecla" data-tecla="4">4</button>
        <button type="button" class="tecla" data-tecla="5">5</button>
        <button type="button" class="tecla" data-tecla="6">6</button>
        <button type="button" class="tecla operador" data-tecla="-" aria-label="Subtrair">−</button>

        <button type="button" class="tecla" data-tecla="1">1</button>
        <button type="button" class="tecla" data-tecla="2">2</button>
        <button type="button" class="tecla" data-tecla="3">3</button>
        <button type="button" class="tecla operador" data-tecla="+" aria-label="Somar">+</button>

        <button type="button" class="tecla funcao" data-tecla="±" aria-label="Trocar sinal">±</button>
        <button type="button" class="tecla" data-tecla="0">0</button>
        <button type="button" class="tecla" data-tecla="." aria-label="Vírgula">,</button>
        <button type="button" class="tecla igual" data-tecla="=" aria-label="Igual">=</button>
      </div>
    </section>

    <aside class="historico" id="historico" aria-label="Histórico de contas">
      <header class="topo-historico">
        <h2>Histórico</h2>
        <div class="acoes-topo">
          <button type="button" class="link" id="limpar-historico">Limpar</button>
          <button type="button" class="botao-icone fechar" id="fechar-historico" title="Fechar">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
            <span class="visualmente-oculto">Fechar histórico</span>
          </button>
        </div>
      </header>
      <ol class="lista-historico" id="lista-historico"></ol>
      <p class="vazio" id="historico-vazio">As contas que você fizer aparecem aqui. Toque numa delas para usar o resultado.</p>
    </aside>
  </main>

  <p class="dica">Pelo teclado: números, vírgula, + − * /, Enter para o resultado, Backspace apaga, Delete limpa o número, Esc limpa tudo.</p>
</body>
</html>
